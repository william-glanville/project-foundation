schema:
  name: architecture_report
  version: '1.0'
  owner: architecture
  dependencies:
  - report_metadata.schema.yaml
  - finding.schema.yaml
root:
  type: object
  required:
  - report_metadata
  - architecture
  additional_properties: false
  properties:
    report_metadata:
      external_ref: report_metadata.schema.yaml#/definitions/report_metadata
    architecture:
      type: object
      required:
      - findings
      - total
      additional_properties: false
      properties:
        findings:
          type: array
          items:
            external_ref: finding.schema.yaml#/definitions/finding
        total:
          type: integer
