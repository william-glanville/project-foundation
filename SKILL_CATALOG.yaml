catalog:
  version: '1.4'
  standard: docs/governance/TASK_DECLARATION_STANDARD.md
  skill_roots:
  - .github/skills
  policy:
    discovery_required: true
    read_before_use: true
    task_declaration_required: true
    project_extensions_allowed: true
    accepted_authority_required: true
  skills:
  - id: adr-authoring
    type: governance
    path: .github/skills/adr-authoring/SKILL.md
    owner: governance
    mode: decision-governance
  - id: architecture-review
    type: review
    path: .github/skills/architecture-review/SKILL.md
    owner: architecture
    mode: review
  - id: contract-change
    type: governance
    path: .github/skills/contract-change/SKILL.md
    owner: governance
    mode: governed-change
  - id: testing-and-validation
    type: validation
    path: .github/skills/testing-and-validation/SKILL.md
    owner: development
    mode: validation
  - id: completion-checkpoint
    type: reporting
    path: .github/skills/completion-checkpoint/SKILL.md
    owner: governance
    mode: reporting
  - id: artifact-package-verification
    type: verification
    path: .github/skills/artifact-package-verification/SKILL.md
    owner: governance
    mode: read-only-verification
  - id: backend-vertical-slice
    type: implementation
    path: .github/skills/backend-vertical-slice/SKILL.md
    owner: development
    mode: implementation
  - id: frontend-vertical-slice
    type: implementation
    path: .github/skills/frontend-vertical-slice/SKILL.md
    owner: development
    mode: implementation
  - id: prompt-change-review
    type: review
    path: .github/skills/prompt-change-review/SKILL.md
    owner: governance
    mode: governed-change
