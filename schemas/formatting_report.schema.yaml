schema:
  name: formatting_report
  version: '1.0'
  owner: formatting
  description: formatting_report contract.
root:
  type: object
  required:
  - report_metadata
  - formatting
  additional_properties: false
  properties:
    report_metadata:
      external_ref: report_metadata.schema.yaml#/definitions/report_metadata
    formatting:
      type: object
      required:
      - mode
      - files_reviewed
      - files_modified
      - formatter_results
      - findings
      - idempotency_check
      additional_properties: false
      properties:
        mode:
          type: string
          enum:
          - review_only
          - apply
        files_reviewed:
          type: integer
          minimum: 0
        files_modified:
          type: integer
          minimum: 0
        formatter_results:
          type: array
          items:
            type: object
            required:
            - tool
            - status
            - files_changed
            properties:
              tool:
                type: string
              status:
                type: string
                enum:
                - passed
                - failed
                - not_available
                - skipped
              files_changed:
                type: integer
                minimum: 0
        findings:
          type: array
          items:
            external_ref: finding.schema.yaml#/definitions/finding
        idempotency_check:
          type: string
          enum:
          - passed
          - failed
          - not_run
