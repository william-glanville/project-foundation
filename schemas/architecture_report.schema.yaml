schema:
  name: architecture_report
  version: '1.0'
  owner: architecture
  description: architecture_report contract.
root:
  type: object
  required:
  - report_metadata
  - architecture
  additional_properties: false
  properties:
    report_metadata:
      external_ref: report_metadata.schema.yaml#/definitions/report_metadata
    architecture:
      type: object
      required:
      - findings
      - summary
      additional_properties: false
      properties:
        findings:
          type: array
          items:
            external_ref: finding.schema.yaml#/definitions/finding
        summary:
          type: object
          required:
          - total
          - open
          - remediated
          properties:
            total:
              type: integer
              minimum: 0
            open:
              type: integer
              minimum: 0
            remediated:
              type: integer
              minimum: 0
