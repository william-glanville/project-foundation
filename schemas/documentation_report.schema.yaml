schema:
  name: documentation_report
  version: '1.0'
  owner: documentation
  description: documentation_report contract.
root:
  type: object
  required:
  - report_metadata
  - documentation
  additional_properties: false
  properties:
    report_metadata:
      external_ref: report_metadata.schema.yaml#/definitions/report_metadata
    documentation:
      type: object
      required:
      - outputs
      - findings
      additional_properties: false
      properties:
        outputs:
          type: array
          items:
            type: object
            required:
            - id
            - path
            - type
            - action
            - generated_from
            properties:
              id:
                type: string
              path:
                type: string
              type:
                type: string
              action:
                type: string
                enum:
                - created
                - updated
                - reviewed
                - skipped
              generated_from:
                type: array
                items:
                  type: string
        findings:
          type: array
          items:
            external_ref: finding.schema.yaml#/definitions/finding
