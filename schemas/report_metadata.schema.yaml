schema:
  name: report_metadata
  version: '1.0'
  owner: governance
root:
  ref: '#/definitions/report_metadata'
definitions:
  report_metadata:
    type: object
    required:
    - generated_at
    - run_id
    - agent
    - agent_version
    - status
    additional_properties: false
    properties:
      generated_at:
        type: string
        format: date-time
      run_id:
        type: string
      agent:
        type: string
      agent_version:
        type: string
      status:
        type: string
        enum:
        - complete
        - partial
        - failed
        - skipped
      notes:
        type: array
        items:
          type: string
