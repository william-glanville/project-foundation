schema:
  name: sanitization_directives
  version: '1.0'
  owner: security
root:
  type: object
  required:
  - sanitization
  properties:
    sanitization:
      type: object
      required:
      - status
      - redactions
      - exclusions
      - quarantines
      - protected_files
      - publication_restrictions
      - downstream_rules
      properties:
        status:
          type: string
          enum:
          - pass
          - restricted
          - blocked
        redactions:
          type: array
          items: &id001
            type: object
            required:
            - id
            - source_finding
            - status
            - owner
            - target
            - rationale
            additional_properties: false
            properties:
              id:
                type: string
              source_finding:
                type: string
              status:
                type: string
                enum:
                - active
                - reviewed
                - expired
                - superseded
              owner:
                type: object
                required:
                - team
                additional_properties: false
                properties:
                  team:
                    type: string
                  contact:
                    type: string
                    nullable: true
              target:
                type: string
              rationale:
                type: string
              created_at:
                type: string
                format: date-time
              review_on:
                type: string
                format: date
                nullable: true
              expires_on:
                type: string
                format: date
                nullable: true
        exclusions:
          type: array
          items: *id001
        quarantines:
          type: array
          items: *id001
        protected_files:
          type: array
          items: *id001
        publication_restrictions:
          type: array
          items: *id001
        downstream_rules:
          type: object
          additional_properties:
            type: object
