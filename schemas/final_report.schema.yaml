schema:
  name: final_report
  version: '1.0'
  owner: reporting
  dependencies:
  - report_metadata.schema.yaml
root:
  type: object
  required:
  - report_metadata
  - pipeline
  additional_properties: false
  properties:
    report_metadata:
      external_ref: report_metadata.schema.yaml#/definitions/report_metadata
    pipeline:
      type: object
      required:
      - name
      - version
      - overall_status
      - stage_results
      - recommendations
      - next_actions
      additional_properties: false
      properties:
        name:
          type: string
        version:
          type: string
        overall_status:
          type: string
          enum:
          - pass
          - restricted
          - blocked
          - failed
        stage_results:
          type: object
          additional_properties:
            type: string
        recommendations:
          type: array
          items:
            type: string
        next_actions:
          type: array
          items:
            type: string
