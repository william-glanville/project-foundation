schema:
  name: security_report
  version: '1.0'
  owner: security
  dependencies:
  - report_metadata.schema.yaml
  - finding.schema.yaml
root:
  type: object
  required:
  - report_metadata
  - security
  additional_properties: false
  properties:
    report_metadata:
      external_ref: report_metadata.schema.yaml#/definitions/report_metadata
    security:
      type: object
      required:
      - status
      - working_tree_scanned
      - history_scanned
      - uninspected_artifacts
      - findings
      - directives_reference
      additional_properties: false
      properties:
        status:
          type: string
          enum:
          - pass
          - restricted
          - blocked
        working_tree_scanned:
          type: boolean
        history_scanned:
          type: boolean
        uninspected_artifacts:
          type: integer
        findings:
          type: array
          items:
            external_ref: finding.schema.yaml#/definitions/finding
        directives_reference:
          type: string
