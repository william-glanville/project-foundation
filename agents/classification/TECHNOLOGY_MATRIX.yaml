matrix:
  version: '1.0'
  mappings:
  - extensions:
    - .cs
    language: csharp
    formatter_family: dotnet
  - extensions:
    - .java
    language: java
    formatter_family: jvm
  - extensions:
    - .py
    language: python
    formatter_family: python
  - extensions:
    - .rs
    language: rust
    formatter_family: rust
  - extensions:
    - .js
    - .mjs
    - .cjs
    language: javascript
    formatter_family: javascript
  - extensions:
    - .jsx
    language: react_jsx
    formatter_family: react
  - extensions:
    - .ts
    - .mts
    - .cts
    language: typescript
    formatter_family: typescript
  - extensions:
    - .tsx
    language: react_tsx
    formatter_family: react
  - extensions:
    - .json
    language: json
    formatter_family: data
  - extensions:
    - .yaml
    - .yml
    language: yaml
    formatter_family: data
  - extensions:
    - .md
    language: markdown
    formatter_family: documentation
  default_exclusions:
    directories:
    - .git
    - node_modules
    - vendor
    - bin
    - obj
    - dist
    - build
    - target
    - coverage
    - .cache
    - .venv
    patterns:
    - '*.generated.*'
    - '*.designer.*'
    - '*.g.*'
    - '*.min.js'
    - '*.map'
