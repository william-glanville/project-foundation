schema:
  name: finding
  version: '1.0'
  owner: governance
root:
  ref: '#/definitions/finding'
definitions:
  finding:
    type: object
    required:
    - id
    - source
    - category
    - title
    - description
    - severity
    - confidence
    - disposition
    - owner
    - locations
    - remediation
    - lifecycle
    additional_properties: false
    properties:
      id:
        type: string
      source:
        type: object
        required:
        - agent
        - report
        - run_id
        properties:
          agent:
            type: string
          report:
            type: string
          run_id:
            type: string
      category:
        type: string
      title:
        type: string
      description:
        type: string
      severity:
        type: string
        enum:
        - critical
        - high
        - medium
        - low
        - informational
      confidence:
        type: string
        enum:
        - confirmed
        - high
        - medium
        - low
      disposition:
        type: string
        enum:
        - open
        - accepted_risk
        - suppressed
        - false_positive
        - remediated
      owner:
        type: object
        required:
        - team
        additional_properties: false
        properties:
          team:
            type: string
          contact:
            type: string
            nullable: true
      locations:
        type: array
        items:
          type: object
          required:
          - path
          - location_type
          properties:
            path:
              type: string
            location_type:
              type: string
      remediation:
        type: object
        required:
        - required
        - guidance
        - verification
        properties:
          required:
            type: boolean
          guidance:
            type: string
          verification:
            type: string
      lifecycle:
        type: object
        required:
        - created_at
        - updated_at
        properties:
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time
          review_on:
            type: string
            format: date
            nullable: true
          expires_on:
            type: string
            format: date
            nullable: true
