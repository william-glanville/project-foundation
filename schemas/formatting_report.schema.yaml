schema:
  name: formatting_report
  version: '1.0'
  owner: formatting
  dependencies:
  - report_metadata.schema.yaml
  - finding.schema.yaml
root:
  type: object
  required:
  - report_metadata
  - formatting
  additional_properties: false
  properties:
    report_metadata:
      external_ref: report_metadata.schema.yaml#/definitions/report_metadata
    formatting:
      type: object
      required:
      - mode
      - files_reviewed
      - files_modified
      - findings
      - idempotency_check
      additional_properties: false
      properties:
        mode:
          type: string
          enum:
          - review_only
          - apply
        files_reviewed:
          type: integer
        files_modified:
          type: integer
        findings:
          type: array
          items:
            external_ref: finding.schema.yaml#/definitions/finding
        idempotency_check:
          type: string
          enum:
          - passed
          - failed
          - not_run
