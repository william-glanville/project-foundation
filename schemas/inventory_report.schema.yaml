schema:
  name: inventory_report
  version: '1.0'
  owner: inventory
  dependencies:
  - report_metadata.schema.yaml
root:
  type: object
  required:
  - report_metadata
  - inventory
  additional_properties: false
  properties:
    report_metadata:
      external_ref: report_metadata.schema.yaml#/definitions/report_metadata
    inventory:
      type: object
      required:
      - project_name
      - project_root
      - files_scanned
      - directories_scanned
      - languages
      - frameworks
      - excluded_paths
      - uninspected_content
      additional_properties: false
      properties:
        project_name:
          type: string
        project_root:
          type: string
        files_scanned:
          type: integer
        directories_scanned:
          type: integer
        languages:
          type: array
          items:
            type: string
        frameworks:
          type: array
          items:
            type: string
        excluded_paths:
          type: array
          items:
            type: string
        uninspected_content:
          type: array
          items:
            type: string
