schema:
  name: documentation_report
  version: '1.0'
  owner: documentation
  dependencies:
  - report_metadata.schema.yaml
  - finding.schema.yaml
root:
  type: object
  required:
  - report_metadata
  - documentation
  additional_properties: false
  properties:
    report_metadata:
      external_ref: report_metadata.schema.yaml#/definitions/report_metadata
    documentation:
      type: object
      required:
      - outputs
      - findings
      additional_properties: false
      properties:
        outputs:
          type: array
          items:
            type: string
        findings:
          type: array
          items:
            external_ref: finding.schema.yaml#/definitions/finding
