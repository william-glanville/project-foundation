schema:
  name: sanitization_directives
  version: '1.0'
  owner: security
  description: Security directives consumed by downstream agents.
root:
  type: object
  required:
  - sanitization
  additional_properties: false
  properties:
    sanitization:
      type: object
      required:
      - version
      - generated_at
      - source
      - status
      - redactions
      - exclusions
      - quarantines
      - protected_files
      - publication_restrictions
      - placeholder_map
      - downstream_rules
      additional_properties: false
      properties:
        version:
          type: string
        generated_at:
          type: string
          format: date-time
        source:
          type: object
          required:
          - agent
          - report
          - run_id
          properties:
            agent:
              type: string
            report:
              type: string
            run_id:
              type: string
        status:
          type: string
          enum:
          - pass
          - restricted
          - blocked
        redactions:
          type: array
          items:
            properties:
              created_at:
                format: date-time
                type: string
              expires_on:
                format: date
                nullable: true
                type: string
              id:
                type: string
              owner:
                additional_properties: false
                properties:
                  contact:
                    nullable: true
                    type: string
                  team:
                    type: string
                required:
                - team
                type: object
              review_on:
                format: date
                nullable: true
                type: string
              source_finding:
                type: string
              status:
                enum:
                - active
                - reviewed
                - expired
                - superseded
                type: string
              path:
                type: string
              replacement:
                type: string
              rationale:
                type: string
            required:
            - id
            - source_finding
            - status
            - owner
            - created_at
            - review_on
            - expires_on
            - path
            - replacement
            - rationale
            type: object
            additional_properties: false
        exclusions:
          type: array
          items:
            properties:
              created_at:
                format: date-time
                type: string
              expires_on:
                format: date
                nullable: true
                type: string
              id:
                type: string
              owner:
                additional_properties: false
                properties:
                  contact:
                    nullable: true
                    type: string
                  team:
                    type: string
                required:
                - team
                type: object
              review_on:
                format: date
                nullable: true
                type: string
              source_finding:
                type: string
              status:
                enum:
                - active
                - reviewed
                - expired
                - superseded
                type: string
              target_type:
                type: string
                enum:
                - file
                - directory
                - pattern
                - archive_member
              target:
                type: string
              reason:
                type: string
            required:
            - id
            - source_finding
            - status
            - owner
            - created_at
            - review_on
            - expires_on
            - target_type
            - target
            - reason
            type: object
            additional_properties: false
        quarantines:
          type: array
          items:
            properties:
              created_at:
                format: date-time
                type: string
              expires_on:
                format: date
                nullable: true
                type: string
              id:
                type: string
              owner:
                additional_properties: false
                properties:
                  contact:
                    nullable: true
                    type: string
                  team:
                    type: string
                required:
                - team
                type: object
              review_on:
                format: date
                nullable: true
                type: string
              source_finding:
                type: string
              status:
                enum:
                - active
                - reviewed
                - expired
                - superseded
                type: string
              path:
                type: string
              severity:
                type: string
                enum:
                - critical
                - high
                - medium
                - low
                - informational
              reason:
                type: string
              requires_human_review:
                type: boolean
            required:
            - id
            - source_finding
            - status
            - owner
            - created_at
            - review_on
            - expires_on
            - path
            - severity
            - reason
            - requires_human_review
            type: object
            additional_properties: false
        protected_files:
          type: array
          items:
            properties:
              created_at:
                format: date-time
                type: string
              expires_on:
                format: date
                nullable: true
                type: string
              id:
                type: string
              owner:
                additional_properties: false
                properties:
                  contact:
                    nullable: true
                    type: string
                  team:
                    type: string
                required:
                - team
                type: object
              review_on:
                format: date
                nullable: true
                type: string
              source_finding:
                type: string
              status:
                enum:
                - active
                - reviewed
                - expired
                - superseded
                type: string
              path:
                type: string
              classification:
                type: string
              access:
                type: string
                enum:
                - security_only
                - security_and_governance
                - restricted_pipeline
              rationale:
                type: string
            required:
            - id
            - source_finding
            - status
            - owner
            - created_at
            - review_on
            - expires_on
            - path
            - classification
            - access
            - rationale
            type: object
            additional_properties: false
        publication_restrictions:
          type: array
          items:
            properties:
              created_at:
                format: date-time
                type: string
              expires_on:
                format: date
                nullable: true
                type: string
              id:
                type: string
              owner:
                additional_properties: false
                properties:
                  contact:
                    nullable: true
                    type: string
                  team:
                    type: string
                required:
                - team
                type: object
              review_on:
                format: date
                nullable: true
                type: string
              source_finding:
                type: string
              status:
                enum:
                - active
                - reviewed
                - expired
                - superseded
                type: string
              category:
                type: string
              action:
                type: string
                enum:
                - redact
                - summarize
                - exclude
                - internal_only
              target:
                type: string
              rationale:
                type: string
            required:
            - id
            - source_finding
            - status
            - owner
            - created_at
            - review_on
            - expires_on
            - category
            - action
            - target
            - rationale
            type: object
            additional_properties: false
        placeholder_map:
          type: array
          items:
            type: object
            required:
            - id
            - source_finding
            - placeholder
            - category
            additional_properties: false
            properties:
              id:
                type: string
              source_finding:
                type: string
              placeholder:
                type: string
              category:
                type: string
        downstream_rules:
          type: object
          required:
          - classification
          - formatting
          - consistency
          - documentation
          - architecture
          - governance
          - reporting
          additional_properties: false
          properties:
            classification: &id001
              type: object
              required:
              - processing_allowed
              - apply_redactions
              - exclude_protected_files
              - exclude_quarantined_content
              - enforce_publication_restrictions
              additional_properties: false
              properties:
                processing_allowed:
                  type: boolean
                apply_redactions:
                  type: boolean
                exclude_protected_files:
                  type: boolean
                exclude_quarantined_content:
                  type: boolean
                enforce_publication_restrictions:
                  type: boolean
            formatting: *id001
            consistency: *id001
            documentation: *id001
            architecture: *id001
            governance: *id001
            reporting: *id001
