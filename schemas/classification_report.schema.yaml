schema:
  name: classification_report
  version: '1.0'
  owner: classification
  dependencies:
  - report_metadata.schema.yaml
root:
  type: object
  required:
  - report_metadata
  - classification
  additional_properties: false
  properties:
    report_metadata:
      external_ref: report_metadata.schema.yaml#/definitions/report_metadata
    classification:
      type: object
      required:
      - languages
      - frameworks
      - build_tools
      - unknown_files
      additional_properties: false
      properties:
        languages:
          type: array
          items:
            type: string
        frameworks:
          type: array
          items:
            type: string
        build_tools:
          type: array
          items:
            type: string
        unknown_files:
          type: array
          items:
            type: string
